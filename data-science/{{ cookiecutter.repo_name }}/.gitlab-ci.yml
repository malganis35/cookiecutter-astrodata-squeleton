variables:
  UV_VERSION: "0.6"
  PYTHON_VERSION: "{{ cookiecutter.python_version.split('.')[:2] | join('.') }}"
  BASE_LAYER: bookworm-slim
  UV_LINK_MODE: copy # GitLab CI build dir requires copy mode
  GIT_DEPTH: "0" # A depth of 0 tells Git to fetch all commits/tags

include:
  - template: Security/SAST.gitlab-ci.yml
  - template: Security/Dependency-Scanning.gitlab-ci.yml
  - template: Security/Secret-Detection.gitlab-ci.yml

.default_git_setup: &default_git_setup
  - apt-get update && apt-get install -y git
  - git remote set-url origin
    "https://${CI_GIT_USERNAME}:${CI_GIT_TOKEN}@gitlab.com/${CI_PROJECT_PATH}.git"
  - git fetch origin
  - git fetch --tags
  - git checkout -B "$CI_DEFAULT_BRANCH" "origin/$CI_DEFAULT_BRANCH"
  - ls -al .git || echo "⚠️ Dossier .git non présent"

.default_image: &default_image ghcr.io/astral-sh/uv:$UV_VERSION-python$PYTHON_VERSION-$BASE_LAYER

workflow:
  rules:
    - if: ($CI_PIPELINE_SOURCE == 'merge_request_event' || $CI_COMMIT_BRANCH ==
        $CI_DEFAULT_BRANCH )

stages:
  - build-devcontainer
  - check
  - test
  - docs
  - deploy
  - release
  - build-project
  - security-scan

# Lint + Format
python_lint:
  stage: check
  image: *default_image
  script:
    - uv run --native-tls --group dev ruff check src/ tests/ app/

python_format:
  stage: check
  image: *default_image
  script:
    - uv run --native-tls --group dev ruff format src/ tests/ app/

python_typecheck:
  stage: check
  image: *default_image
  script:
    - uv run --native-tls --group dev mypy src/ tests/ app/

commit_lint:
  stage: check
  image: *default_image
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  script:
    - uv run cz check --rev-range origin/$CI_DEFAULT_BRANCH..HEAD

# Tests unitaires
coverage:
  stage: test
  image: *default_image
  timeout: 10 minutes
  retry:
    max: 2
    when: runner_system_failure
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  cache: &default_cache
    key: ${CI_COMMIT_REF_SLUG}
    paths:
      - /root/.cache/uv
      - .venv/
  script:
    - uv run --native-tls --group dev pytest
  coverage: "/(?i)total.*? (100(?:\\.0+)?\\%|[1-9]?\\d(?:\\.\\d+)?\\%)$/"
  artifacts:
    when: always
    paths:
      - report.xml
    reports:
      junit: report.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml

# Test the retro-compatibility of the package again multiple python version
pytest:
  stage: test
  image: *default_image
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  cache: *default_cache
  script:
    - uv run --native-tls --python ${VERSION} --group dev pytest
  parallel:
    matrix:
      - VERSION:
          - "{{ cookiecutter.python_version }}"

# Versioning + changelog (release)
release:
  stage: release
  image: *default_image
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: on_success
    - when: never
  before_script: *default_git_setup
  script:
    - git config --global user.name "CI Gitlab"
    - git config --global user.email "ci@gitlab.com"
    - uv run cz bump --yes --changelog
    - git push origin "$CI_DEFAULT_BRANCH"
    - git push --tags
  needs:
    - "python_format"
    - "python_lint"
    - coverage
    - pytest

# Build the Docker image (API) with OCI labels
build-docker-api:
  variables:
    DOCKER_BUILDKIT: "1"
  stage: build-project
  image: docker:latest
  needs:
    - release
  environment:
    name: {{ cookiecutter.package_name }}-production
    url: https://my-app.com
  services:
    - docker:dind
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - |
      docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY

      VERSION=$(cat VERSION)

      docker build \
        --cache-from $CI_REGISTRY_IMAGE/api:latest \
        --build-arg BUILDKIT_INLINE_CACHE=1 \
        --build-arg BUILD_VERSION=$(cat VERSION) \
        --build-arg BUILD_REVISION=$CI_COMMIT_SHA \
        --build-arg BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ) \
        --target api \
        -t api:latest \
        -f dockerfiles/Dockerfile \
        .
      
      docker push $CI_REGISTRY_IMAGE/api:$VERSION
      docker push $CI_REGISTRY_IMAGE/api:latest

# ── Documentation (Sphinx → GitLab Pages) ──────────────────────────────────────
build_docs:
  stage: docs
  image: *default_image
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - docs/project_documentation/**/*
        - .gitlab-ci.yml
    - if: $CI_PIPELINE_SOURCE == "web"
  cache: *default_cache
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends git
  script:
    - uv sync --no-install-project --project docs/project_documentation/
    - uv run --project docs/project_documentation/ sphinx-build -b html
      docs/project_documentation/ public/
  artifacts:
    paths:
      - public/
    expire_in: 1 day

# The job "pages" must be called "pages" to activate GitLab Pages
pages:
  stage: deploy
  image: alpine:latest
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  needs:
    - job: build_docs
      optional: true
  script:
    - echo "📚 Documentation is deployed on GitLab Pages"
  artifacts:
    paths:
      - public/

# ── Documentation (Sphinx → GitLab Pages) ──────────────────────────────────────
trivy-scan:
  stage: security-scan
  image: aquasec/trivy:latest
  when: manual
  script:
    - trivy fs --exit-code 1 --severity HIGH,CRITICAL .
    
trivy-docker:
  stage: security-scan
  when: manual
  script:
    - trivy image --exit-code 1 --severity CRITICAL $CI_REGISTRY_IMAGE/api:latest